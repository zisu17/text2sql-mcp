name: Publish Graph MCP image

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-image.yml
      - .dockerignore
      - Dockerfile
      - pyproject.toml
      - uv.lock
      - src/**
      - tests/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv==0.13.9
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Unit tests
        # Integration tests skip without GRAPH_INTEGRATION_TEST; a failure here stops the publish.
        run: uv run --frozen python -m unittest discover -s tests -v
      - name: Sign in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and publish
        env:
          IMAGE: ghcr.io/zisu17/text2sql-mcp
        run: |
          docker build -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" .
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
