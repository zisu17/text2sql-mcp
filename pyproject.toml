[project]
name = "text2sql-graph-mcp"
version = "0.1.0"
description = "Read-only MCP access to the Text2SQL metadata graph"
requires-python = ">=3.11"
dependencies = ["mcp>=2,<3", "neo4j>=6,<7", "starlette>=1,<2", "uvicorn>=0.30,<1"]

[project.scripts]
text2sql-graph-mcp = "text2sql_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/text2sql_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
